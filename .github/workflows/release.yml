name: Release

# Runs on a pushed v* tag, or when update-holidays.yml dispatches it with
# `--ref vX.Y.Z` (tags pushed with GITHUB_TOKEN do not trigger workflows, but
# workflow_dispatch does). Either way this file is the workflow that publishes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # data/holidays.json is hand-edited for SKB amendments; a broken edit would
  # crash every installed app on start, so never publish one.
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Check release ref
        run: |
          version=$(ruby -e 'puts Gem::Specification.load("id-calendar-tui.gemspec").version')
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::Release must run on tag v$version (gemspec version), got $GITHUB_REF"
            exit 1
          fi

      - name: Load holiday data
        run: ruby -Ilib -e 'require "holidays"; IndonesiaCalendar::Holidays.data'

  build-and-push-docker:
    needs: validate-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # value= makes the tag explicit; the default only reads it on push events.
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-gem:
    needs: validate-data
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push tags
      id-token: write  # Required for OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Configure git
        run: |
          git config --global user.email "$(git log -1 --pretty=format:'%ae')"
          git config --global user.name "$(git log -1 --pretty=format:'%an')"

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1
        with:
          await-approval: false
